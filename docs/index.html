<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Perangkat Ajar Pembelajaran Mendalam Berbasis Cinta</title>
    <meta name="description" content="Dashboard Administrasi Guru Profesional untuk menyusun RPP, Modul Ajar, Bahan Ajar, LKPD, Asesmen, PROTA, dan PROMES berbasis Pendekatan Pembelajaran Mendalam dan Berbasis Cinta dengan bantuan AI Gemini." />
    <meta property="og:title" content="Panel Perangkat Ajar Pembelajaran Mendalam Berbasis Cinta" />
    <meta property="og:description" content="Dashboard Administrasi Guru Profesional untuk menyusun RPP, Modul Ajar, Bahan Ajar, LKPD, Asesmen, PROTA, dan PROMES berbasis Pendekatan Pembelajaran Mendalam dan Berbasis Cinta dengan bantuan AI Gemini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      // GitHub Pages path resolution: ensure trailing slash so relative paths './assets/...' resolve correctly
      (function() {
        try {
          var h = window.location.hostname;
          var p = window.location.pathname;
          if ((h.includes('github.io') || h.includes('pages.dev')) && p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
            window.location.replace(p + '/' + window.location.search + window.location.hash);
          }
        } catch (e) {
          console.warn('Path resolution check:', e);
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DfJmw8RX.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CBapUMSX.css">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <div id="root">
      <div id="app-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #1e293b; padding: 24px; text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin: 0 0 8px 0;">Memuat Panel Perangkat Ajar...</h2>
        <p style="font-size: 0.875rem; color: #64748b; margin: 0; max-width: 440px; line-height: 1.5;">
          Perencanaan pembelajaran mendalam berbasis cinta &bull; Menyiapkan data administrasi guru.
        </p>

        <noscript>
          <div style="margin-top: 20px; padding: 16px; background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; color: #991b1b; max-width: 400px; font-size: 0.875rem;">
            ⚠️ <strong>JavaScript Non-Aktif:</strong> Aplikasi ini membutuhkan JavaScript untuk berjalan. Harap aktifkan JavaScript di peramban Anda.
          </div>
        </noscript>
      </div>

      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <!-- Watchdog supervisor for static hosts / GitHub Pages -->
    <script>
      (function() {
        var lastError = null;
        window.addEventListener('error', function(e) {
          try {
            var msg = e.message || (e.target && e.target.src ? 'Gagal memuat berkas: ' + e.target.src : 'Error');
            lastError = msg;
            showDiagnostics(msg);
          } catch(err) {}
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          try {
            var msg = e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled Promise Rejection';
            lastError = msg;
            showDiagnostics(msg);
          } catch(err) {}
        });

        // Watchdog: If after 3.5 seconds React hasn't replaced #app-loader
        setTimeout(function() {
          var loader = document.getElementById('app-loader');
          if (loader) {
            showDiagnostics(lastError || 'Pemuatan aplikasi memerlukan verifikasi hosting.');
          }
        }, 3500);

        function showDiagnostics(errorMsg) {
          var loader = document.getElementById('app-loader');
          if (!loader) return; // React has mounted successfully

          var existing = document.getElementById('app-diagnostics-box');
          if (existing) return;

          var isGitHub = window.location.hostname.includes('github.io');
          
          var box = document.createElement('div');
          box.id = 'app-diagnostics-box';
          box.style.maxWidth = '520px';
          box.style.width = '100%';
          box.style.marginTop = '24px';
          box.style.background = '#ffffff';
          box.style.border = '1px solid #e2e8f0';
          box.style.borderRadius = '16px';
          box.style.padding = '20px';
          box.style.boxShadow = '0 10px 25px -5px rgba(0,0,0,0.06)';
          box.style.textAlign = 'left';
          box.style.boxSizing = 'border-box';

          var content = '<h3 style="font-size:1rem; font-weight:700; color:#0f172a; margin:0 0 8px 0; display:flex; align-items:center; gap:8px;">' +
            '<span>💡</span> Status Pemuatan GitHub' +
            '</h3>' +
            '<p style="font-size:0.8125rem; color:#475569; margin:0 0 12px 0; line-height:1.5;">' +
            (isGitHub
              ? 'Aplikasi dibuka melalui <strong>GitHub Pages</strong>. Jika halaman tidak berganti, pastikan di GitHub: <strong>Settings &rarr; Pages &rarr; Source</strong> diatur ke <strong>GitHub Actions</strong> (alur kerja build otomatis telah aktif di repositori).'
              : 'Sedang menyelesaikan inisialisasi modul. Jika proses berlanjut terlalu lama, silakan muat ulang atau buka dari folder docs.') +
            '</p>';

          if (errorMsg) {
            content += '<div style="background:#fef2f2; border:1px solid #fecaca; padding:8px 12px; border-radius:8px; font-size:0.75rem; font-family:monospace; color:#991b1b; margin-bottom:14px; word-break:break-all;">' +
              errorMsg +
              '</div>';
          }

          content += '<div style="display:flex; flex-wrap:wrap; gap:8px;">' +
            '<button onclick="window.location.reload()" style="flex:1; min-width:130px; padding:9px 14px; background:#2563eb; color:#ffffff; border:none; border-radius:10px; font-size:0.8125rem; font-weight:600; cursor:pointer;">🔄 Muat Ulang</button>' +
            '<a href="./docs/" style="flex:1; min-width:130px; padding:9px 14px; background:#f8fafc; color:#1e293b; border:1px solid #cbd5e1; border-radius:10px; font-size:0.8125rem; font-weight:600; text-align:center; text-decoration:none;">📂 Buka dari /docs/</a>' +
            '</div>';

          box.innerHTML = content;
          loader.appendChild(box);
        }
      })();
    </script>
  </body>
</html>
